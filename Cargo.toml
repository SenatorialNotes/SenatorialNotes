[package]
name = "senatorial-notes"
version = "0.2.0-alpha"
edition = "2024"
rust-version = "1.92"
description = "A private, local-only Markdown notes application for Linux"
license = "GPL-3.0-or-later"
repository = "https://github.com/SenatorialNotes/SenatorialNotes"
homepage = "https://github.com/SenatorialNotes/SenatorialNotes"
readme = "README.md"
keywords = ["notes", "markdown", "gtk", "offline"]
categories = ["gui", "text-editors"]

[features]
default = ["gui"]
gui = ["dep:adw", "dep:gtk", "dep:sourceview5"]

[dependencies]
argon2 = { version = "0.5", features = ["zeroize"] }
chrono = { version = "0.4", features = ["serde"] }
chacha20poly1305 = "0.10"
directories = "6"
getrandom = "0.3"
hkdf = "0.12"
libc = "0.2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = { version = "1", features = ["derive"] }

[dependencies.gtk]
package = "gtk4"
version = "0.11"
features = ["v4_10"]
optional = true

[dependencies.adw]
package = "libadwaita"
version = "0.9"
features = ["v1_4"]
optional = true

[dependencies.sourceview5]
version = "0.11"
optional = true

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "senatorial-notes"
path = "src/main.rs"
required-features = ["gui"]

[profile.dev]
codegen-units = 1

[profile.dev.build-override]
codegen-units = 1

[profile.test]
codegen-units = 1

[profile.test.build-override]
codegen-units = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
